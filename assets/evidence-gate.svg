<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Evidence gate</title>
  <desc id="desc">A claim moves through a receipt and verifier before action. Failed verification is preserved as residue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081827"/>
      <stop offset="1" stop-color="#102f3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020a10" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="270" rx="26" fill="url(#bg)"/>
  <path d="M0 212 C180 174 330 251 520 205 S880 134 1200 190" fill="none" stroke="#78d4d1" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M0 231 C180 193 330 270 520 224 S880 153 1200 209" fill="none" stroke="#e98554" stroke-opacity="0.15" stroke-width="2"/>
  <g fill="none" stroke="#b7c9c8" stroke-width="3" stroke-linecap="round">
    <path d="M235 108 H350"/>
    <path d="M510 108 H625"/>
    <path d="M785 108 H900"/>
  </g>
  <g fill="#78d4d1">
    <circle cx="293" cy="108" r="5"/>
    <circle cx="568" cy="108" r="5"/>
    <circle cx="843" cy="108" r="5"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="21" text-anchor="middle" filter="url(#shadow)">
    <g>
      <rect x="60" y="68" width="175" height="80" rx="14" fill="#f3f0e8"/>
      <text x="147.5" y="116" fill="#102333">CLAIM</text>
    </g>
    <g>
      <rect x="335" y="68" width="175" height="80" rx="14" fill="#d8e7e4"/>
      <text x="422.5" y="116" fill="#102333">RECEIPT</text>
    </g>
    <g>
      <rect x="610" y="68" width="175" height="80" rx="14" fill="#e98554"/>
      <text x="697.5" y="116" fill="#14212a">VERIFIER</text>
    </g>
    <g>
      <rect x="885" y="68" width="175" height="80" rx="14" fill="#cbe47a"/>
      <text x="972.5" y="116" fill="#14212a">ACTION</text>
    </g>
  </g>
  <path d="M697.5 148 V190 H797" fill="none" stroke="#e98554" stroke-width="3" stroke-dasharray="7 8"/>
  <circle cx="697.5" cy="190" r="6" fill="#e98554"/>
  <text x="817" y="198" fill="#f3f0e8" font-family="Georgia, 'Times New Roman', serif" font-size="19">RESIDUE, NOT CONSENSUS</text>
  <text x="1140" y="234" fill="#78d4d1" font-family="Georgia, 'Times New Roman', serif" font-size="48" text-anchor="end" opacity="0.72">&#934;</text>
</svg>
